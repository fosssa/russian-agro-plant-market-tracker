services:
  backend:
    container_name: agro-backend
    image: ${CI_REGISTRY_IMAGE}/backend:${DEPLOY_TAG:-latest}
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - UVICORN_ROOT_PATH=${UVICORN_ROOT_PATH}
    networks:
      - agro-network
    volumes:
      # Persist SQLite database
      - agro-db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      uvicorn main:app 
      --host 0.0.0.0 
      --port 7000 
      --workers ${WORKERS:-1}
      --log-level ${LOG_LEVEL:-info}

  frontend:
    container_name: agro-frontend
    image: ${CI_REGISTRY_IMAGE}/frontend:${DEPLOY_TAG:-latest}
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_API_TIMEOUT=${VITE_API_TIMEOUT}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
    ports:
      - "80:7073"
    networks:
      - agro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7073/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    entrypoint: ["/entrypoint.sh"]
    command: nginx -g 'daemon off;'

networks:
  agro-network:
    driver: bridge
    name: agro-network

volumes:
  agro-db-data:
    name: agro-db-data
