server {
    # Listen on port 7073
    listen 7073;
    listen [::]:7073;
    
    # Server name (can be customized via environment variables if needed)
    server_name localhost;
    
    # Document root for static files
    root /usr/share/nginx/html;
    index index.html;
    
    # Enable gzip compression to reduce transfer size
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;
    
    # Client body size limit
    client_max_body_size 10M;
    
    # Keepalive timeout
    keepalive_timeout 65;
    
    # HTTP Basic Authentication
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    
    # Proxy backend API
    location /api/ {
        proxy_pass http://backend:7000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main location block - SPA routing support
    location / {
        # Try to serve file directly, fallback to index.html for client-side routing
        try_files $uri $uri/ /index.html;
        
        # Add headers for security
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Cache control for HTML files (no caching)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        
        # Cache control for static assets (aggressive caching)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Health check endpoint (bypasses authentication)
    location /health {
        auth_basic off;
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
